# Render Blueprint: one free web service running the built app, link previews
# and the sync server (server/index.ts). Render → New → Blueprint → this repo.
services:
  - type: web
    name: heist-workspace
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run serve
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # The free tier's disk is wiped on restart; browsers re-upload their
      # boards when they reconnect.
      - key: DATA_DIR
        value: /tmp/heist-data
      # Key for the admin file manager (click the logo 5 times). Render makes a
      # random one; see it under the service's Environment tab.
      - key: ADMIN_KEY
        generateValue: true
